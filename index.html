<style>
  :root{
    --bg:#0c0a12;
    --panel-a:#221a38;
    --panel-b:#132925;
    --tile-a:#8b5cf6;
    --tile-a-dark:#6a3ff0;
    --tile-b:#2dd4a7;
    --tile-b-dark:#1aa885;
    --ink:#eee9f7;
    --ink-dim:#948da8;
    --line:#2a2438;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Manrope",system-ui,-apple-system,Segoe UI,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    overflow-x:hidden;
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 24px;}

  /* ---------- Hero ---------- */
  .hero{padding:64px 0 40px;text-align:center;}
  .badge{
    width:56px;height:56px;border-radius:14px;object-fit:cover;
    margin:0 auto 24px;display:block;box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .tiles{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:0 0 22px;}
  .tile{
    display:inline-flex;align-items:center;justify-content:center;
    width:48px;height:52px;font-weight:800;font-size:26px;
    border-radius:8px;color:#171320;box-shadow:0 4px 0 rgba(0,0,0,.35);
    user-select:none;
  }
  .tile.a{background:linear-gradient(180deg,var(--tile-a),var(--tile-a-dark));}
  .tile.b{background:linear-gradient(180deg,var(--tile-b),var(--tile-b-dark));}
  .tile.gap{width:16px;background:none;box-shadow:none;}
  .tile:nth-child(2n){transform:rotate(-3deg);}
  .tile:nth-child(3n){transform:rotate(2deg);}
  .tile:nth-child(5n){transform:rotate(-1deg);}
  h1.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  .tagline{color:var(--ink-dim);font-size:18px;max-width:460px;margin:0 auto 30px;line-height:1.5;}
  .cta-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:14px 26px;
    border-radius:12px;font-weight:700;font-size:16px;text-decoration:none;border:1px solid transparent;
  }
  .btn-primary{background:var(--tile-a);color:#fff;}
  .btn-primary:hover{background:var(--tile-a-dark);}
  .btn-ghost{color:var(--ink);border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--tile-b);color:var(--tile-b);}

  /* ---------- Duel rules ---------- */
  .duel{padding:40px 0 56px;border-top:1px solid var(--line);}
  .duel-grid{
    display:grid;grid-template-columns:1fr auto 1fr;
    border-radius:20px;overflow:hidden;border:1px solid var(--line);
  }
  .side{padding:32px 26px;}
  .side.left{background:var(--panel-a);text-align:right;}
  .side.right{background:var(--panel-b);text-align:left;}
  .side .num{font-size:13px;font-weight:700;display:block;margin-bottom:10px;}
  .side.left .num{color:var(--tile-a);}
  .side.right .num{color:var(--tile-b);}
  .side p{margin:0;color:var(--ink-dim);font-size:15px;line-height:1.6;max-width:260px;}
  .side.left p{margin-left:auto;}
  .vs{
    display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);font-weight:800;font-size:14px;
    padding:0 18px;
  }
  @media (max-width:640px){
    .duel-grid{grid-template-columns:1fr;}
    .side.left, .side.right{text-align:left;}
    .side.left p{margin-left:0;}
    .vs{padding:12px 26px;}
  }

  /* ---------- Screenshots ---------- */
  .gallery{padding:56px 0 64px;border-top:1px solid var(--line);}
  .phones{
    position:relative;
    display:flex;justify-content:center;align-items:flex-end;
    height:400px;
  }
  .phone{
    border-radius:22px;overflow:hidden;border:1px solid var(--line);
    box-shadow:0 20px 40px rgba(0,0,0,.5);
  }
  .phone img{display:block;width:100%;height:100%;object-fit:cover;}
  .phone.center{width:190px;height:400px;z-index:2;}
  .phone.side-shot{position:absolute;width:170px;height:330px;opacity:.8;}
  .phone.side-shot.l{left:calc(50% - 205px);transform:rotate(-9deg);}
  .phone.side-shot.r{right:calc(50% - 205px);transform:rotate(9deg);}
  @media (max-width:640px){
    .phones{height:320px;}
